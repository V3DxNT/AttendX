apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: attendx
data:
  ENV: "production"
  FRONTEND_URL: "https://your-frontend.vercel.app"
  MATCH_THRESHOLD: "0.40"
  DUPLICATE_THRESHOLD: "0.30"
  COOKIE_SECURE: "true"
  JWT_ACCESS_MINUTES: "15"
  JWT_REFRESH_DAYS: "7"
  INSIGHTFACE_HOME: "/opt/insightface"
