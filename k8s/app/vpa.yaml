apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: attendx-backend-vpa
  namespace: attendx
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: attendx-backend
  updatePolicy:
    updateMode: "Initial"
  resourcePolicy:
    containerPolicies:
      - containerName: backend
        minAllowed:
          cpu: "200m"
          memory: "512Mi"
        maxAllowed:
          cpu: "2000m"
          memory: "2048Mi"
        controlledResources: ["cpu", "memory"]
